<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa dos dezoito capítulos do curso</title>
  <desc id="desc">Quatro blocos verticais mostram a progressão de pixels e geometria para processamento clássico, detecção e movimento, e redes neurais e aplicações.</desc>
  <rect width="1200" height="720" fill="#f7f8fc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#172554">Da matriz à interpretação visual</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="45" y="110" width="250" height="500" rx="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
    <text x="170" y="158" text-anchor="middle" font-size="28" font-weight="700" fill="#1e3a8a">Pixels e geometria</text>
    <text x="75" y="215" font-size="25" fill="#172554">1. Matrizes e máscaras</text>
    <text x="75" y="265" font-size="25" fill="#172554">2. Transformações</text>
    <text x="75" y="330" font-size="23" fill="#334155">Entrada:</text>
    <text x="75" y="370" font-size="23" fill="#334155">números e coordenadas</text>
    <text x="75" y="445" font-size="23" fill="#334155">Saída:</text>
    <text x="75" y="485" font-size="23" fill="#334155">imagem modificada</text>

    <rect x="335" y="110" width="250" height="500" rx="24" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
    <text x="460" y="158" text-anchor="middle" font-size="28" font-weight="700" fill="#14532d">Processamento</text>
    <text x="365" y="210" font-size="24" fill="#14532d">3. Filtros e bordas</text>
    <text x="365" y="255" font-size="24" fill="#14532d">4. Morfologia</text>
    <text x="365" y="300" font-size="24" fill="#14532d">5. Contornos</text>
    <text x="365" y="345" font-size="24" fill="#14532d">6. Cores</text>
    <text x="365" y="420" font-size="23" fill="#334155">Limpar, separar</text>
    <text x="365" y="460" font-size="23" fill="#334155">e medir regiões</text>

    <rect x="625" y="110" width="250" height="500" rx="24" fill="#ffedd5" stroke="#c2410c" stroke-width="4"/>
    <text x="750" y="158" text-anchor="middle" font-size="28" font-weight="700" fill="#7c2d12">Detecção</text>
    <text x="655" y="215" font-size="24" fill="#7c2d12">7. Template e Haar</text>
    <text x="655" y="260" font-size="24" fill="#7c2d12">8. Features locais</text>
    <text x="655" y="305" font-size="24" fill="#7c2d12">9. Vídeo e fluxo</text>
    <text x="655" y="390" font-size="23" fill="#334155">Localizar padrões</text>
    <text x="655" y="430" font-size="23" fill="#334155">e acompanhar</text>
    <text x="655" y="470" font-size="23" fill="#334155">movimento</text>

    <rect x="915" y="110" width="240" height="500" rx="24" fill="#ede9fe" stroke="#6d28d9" stroke-width="4"/>
    <text x="1035" y="158" text-anchor="middle" font-size="28" font-weight="700" fill="#4c1d95">Redes e 3D</text>
    <text x="940" y="205" font-size="22" fill="#4c1d95">10–11. DNN e YOLO</text>
    <text x="940" y="245" font-size="22" fill="#4c1d95">12–14. Pose, faces, OCR</text>
    <text x="940" y="285" font-size="22" fill="#4c1d95">15. Visão estéreo</text>
    <text x="940" y="325" font-size="22" fill="#4c1d95">16. CNN</text>
    <text x="940" y="365" font-size="22" fill="#4c1d95">17. GAN</text>
    <text x="940" y="405" font-size="22" fill="#4c1d95">18. YOLO moderno</text>
    <text x="940" y="480" font-size="23" fill="#334155">Interpretar, aprender</text>
    <text x="940" y="520" font-size="23" fill="#334155">e gerar</text>

    <line x1="295" y1="360" x2="330" y2="360" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="585" y1="360" x2="620" y2="360" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="875" y1="360" x2="910" y2="360" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="600" y="675" text-anchor="middle" font-size="25" fill="#334155">Cada bloco reutiliza as representações e verificações aprendidas no anterior.</text>
  </g>
</svg>
